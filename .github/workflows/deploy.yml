name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/Beydle.Tests/Beydle.Tests.csproj -c Release
      - name: Publish
        run: dotnet publish Beydle.csproj -c Release -o publish
      - name: Rewrite base href for repo sub-path
        run: sed -i 's|<base href="/" />|<base href="/Beydle/" />|' publish/wwwroot/index.html
      - name: SPA fallback for deep links
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
